<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" role="img" aria-labelledby="title desc">
  <title id="title">媒体机常见故障定位表</title>
  <desc id="desc">根据镜像、心跳、任务、成品或公开播放的中断位置，定位 Docker、录像、素材、编码器或公开设置。</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#56505b" stroke-width="1.4" stroke-linejoin="round"/></marker></defs>
  <rect width="640" height="450" fill="#fffcf9"/>
  <text x="24" y="42" fill="#25202a" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" font-weight="650" text-anchor="start">先找出中断的位置</text>
  <text x="304" y="42" fill="#56505b" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="650" text-anchor="start">再打开相应位置核对</text>
  <rect x="22" y="60" width="245" height="64" rx="12" fill="#f9edf1" stroke="#d9cfd5"/>
  <text x="42" y="100" fill="#8b2444" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="650" text-anchor="start">镜像未拉取</text>
  <path d="M270 92h27" fill="none" stroke="#56505b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="305" y="60" width="312" height="64" rx="12" fill="#e9f5f3" stroke="#d9cfd5"/>
  <text x="320" y="87" fill="#135f61" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="21" font-weight="650" text-anchor="start">Docker 守护进程</text>
  <text x="320" y="111" fill="#25202a" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="450" text-anchor="start">镜像标签、架构、代理</text>
  <rect x="22" y="137" width="245" height="64" rx="12" fill="#f9edf1" stroke="#d9cfd5"/>
  <text x="42" y="177" fill="#8b2444" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="650" text-anchor="start">媒体机离线</text>
  <path d="M270 169h27" fill="none" stroke="#56505b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="305" y="137" width="312" height="64" rx="12" fill="#e9f5f3" stroke="#d9cfd5"/>
  <text x="320" y="164" fill="#135f61" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="21" font-weight="650" text-anchor="start">容器状态与日志</text>
  <text x="320" y="188" fill="#25202a" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="450" text-anchor="start">比赛地址、DNS、证书</text>
  <rect x="22" y="214" width="245" height="64" rx="12" fill="#f9edf1" stroke="#d9cfd5"/>
  <text x="42" y="254" fill="#8b2444" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="650" text-anchor="start">在线却没有任务</text>
  <path d="M270 246h27" fill="none" stroke="#56505b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="305" y="214" width="312" height="64" rx="12" fill="#e9f5f3" stroke="#d9cfd5"/>
  <text x="320" y="241" fill="#135f61" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="21" font-weight="650" text-anchor="start">录像与版式</text>
  <text x="320" y="265" fill="#25202a" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="450" text-anchor="start">提交片段、筛选范围、分区</text>
  <rect x="22" y="291" width="245" height="64" rx="12" fill="#f9edf1" stroke="#d9cfd5"/>
  <text x="42" y="331" fill="#8b2444" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="650" text-anchor="start">成品缺画面</text>
  <path d="M270 323h27" fill="none" stroke="#56505b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="305" y="291" width="312" height="64" rx="12" fill="#e9f5f3" stroke="#d9cfd5"/>
  <text x="320" y="318" fill="#135f61" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="21" font-weight="650" text-anchor="start">素材与媒体机</text>
  <text x="320" y="342" fill="#25202a" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="450" text-anchor="start">分路缺段、磁盘、编码器</text>
  <rect x="22" y="368" width="245" height="64" rx="12" fill="#f9edf1" stroke="#d9cfd5"/>
  <text x="42" y="408" fill="#8b2444" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="650" text-anchor="start">观众看不到成品</text>
  <path d="M270 400h27" fill="none" stroke="#56505b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="305" y="368" width="312" height="64" rx="12" fill="#e9f5f3" stroke="#d9cfd5"/>
  <text x="320" y="395" fill="#135f61" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="21" font-weight="650" text-anchor="start">公开页与大屏设置</text>
  <text x="320" y="419" fill="#25202a" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="450" text-anchor="start">撤下、封榜、版式范围</text>
</svg>
