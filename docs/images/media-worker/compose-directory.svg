  <g transform="translate(87 148) scale(1.25)" stroke="#8b2444" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="8" r="4.5"/><path d="m10 11 10 10 2-2-2-2 1.5-1.5-2-2L18 15l-5-5"/></g>
