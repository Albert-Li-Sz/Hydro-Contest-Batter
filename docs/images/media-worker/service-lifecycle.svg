<svg xmlns="http://www.w3.org/2000/svg" width="640" height="309" viewBox="0 0 640 309" role="img" aria-labelledby="title desc">
  <title id="title">启停服务与更新镜像</title>
  <desc id="desc">使用 stop 和 start 暂停或恢复同一容器，更换版本则更新镜像标签、拉取并重建后核对心跳。</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#56505b" stroke-width="1.4" stroke-linejoin="round"/></marker></defs>
  <rect width="640" height="309" fill="#fffcf9"/>
  <text x="24" y="42" fill="#25202a" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="24" font-weight="650" text-anchor="start">暂停与恢复</text>
  <rect x="22" y="60" width="157" height="92" rx="12" fill="#e9f5f3" stroke="#d9cfd5"/>
  <text x="101" y="116" fill="#135f61" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="24" font-weight="650" text-anchor="middle">运行中</text>
  <rect x="462" y="60" width="156" height="92" rx="12" fill="#f9edf1" stroke="#d9cfd5"/>
  <text x="540" y="116" fill="#8b2444" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="24" font-weight="650" text-anchor="middle">已停止</text>
  <path d="M184 97h269" fill="none" stroke="#56505b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="320" y="86" fill="#25202a" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="18" font-weight="450" text-anchor="middle">docker compose stop</text>
  <path d="M456 132H187" fill="none" stroke="#56505b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="320" y="122" fill="#25202a" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="18" font-weight="450" text-anchor="middle">docker compose start</text>
  <text x="24" y="202" fill="#25202a" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="24" font-weight="650" text-anchor="start">更换版本</text>
  <rect x="22" y="221" width="148" height="64" rx="12" fill="#f9edf1" stroke="#d9cfd5"/>
  <text x="96" y="260" fill="#8b2444" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="650" text-anchor="middle">改镜像标签</text>
  <path d="M174 254h39" fill="none" stroke="#56505b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="221" y="221" width="187" height="64" rx="12" fill="white" stroke="#d9cfd5"/>
  <text x="315" y="260" fill="#25202a" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="21" font-weight="650" text-anchor="middle">pull → up -d</text>
  <path d="M413 254h38" fill="none" stroke="#56505b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="458" y="221" width="160" height="64" rx="12" fill="#e9f5f3" stroke="#d9cfd5"/>
  <text x="538" y="260" fill="#135f61" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="650" text-anchor="middle">核对心跳</text>
</svg>
