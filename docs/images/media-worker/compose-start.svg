<svg xmlns="http://www.w3.org/2000/svg" width="640" height="337" viewBox="0 0 640 337" role="img" aria-labelledby="title desc">
  <title id="title">Compose 拉取与启动实测摘录</title>
  <desc id="desc">测试记录中的镜像拉取已完成、容器已启动；此后需回比赛后台核对在线心跳。</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#56505b" stroke-width="1.4" stroke-linejoin="round"/></marker></defs>
  <rect width="640" height="337" fill="#fffcf9"/>
  <g transform="translate(28 24) scale(1.4)" stroke="#8b2444" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="22" height="18" rx="2"/><path d="m5.5 8 4 4-4 4M12 16h5"/></g>
  <text x="79" y="50" fill="#25202a" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" font-weight="650" text-anchor="start">Compose 启动记录</text>
  <rect x="22" y="75" width="596" height="172" rx="9" fill="#29252d" stroke="#29252d"/>
  <text x="42" y="109" fill="#fffcfa" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="22" font-weight="450" text-anchor="start">$ docker compose pull</text>
  <text x="42" y="142" fill="#98ddcc" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="22" font-weight="650" text-anchor="start">Pulled</text>
  <text x="42" y="185" fill="#fffcfa" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="22" font-weight="450" text-anchor="start">$ docker compose up -d</text>
  <text x="42" y="221" fill="#98ddcc" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="18" font-weight="450" text-anchor="start">Container hcb-guide-public-reactions-1 Started</text>
  <path d="M115 249v24" fill="none" stroke="#56505b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="32" y="308" fill="#135f61" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="650" text-anchor="start">到「媒体机」刷新心跳</text>
</svg>
