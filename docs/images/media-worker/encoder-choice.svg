<svg xmlns="http://www.w3.org/2000/svg" width="640" height="406" viewBox="0 0 640 406" role="img" aria-labelledby="title desc">
  <title id="title">按运行环境选择编码器</title>
  <desc id="desc">通用容器可使用 CPU，Linux 的 NVIDIA 和 Intel 或 VAAPI 需暴露硬件，macOS 本机可使用 VideoToolbox。选定模式后生成并播放样片。</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#56505b" stroke-width="1.4" stroke-linejoin="round"/></marker></defs>
  <rect width="640" height="406" fill="#fffcf9"/>
  <rect x="22" y="22" width="288" height="124" rx="12" fill="#f9edf1" stroke="#d9cfd5"/>
  <g transform="translate(35 36) scale(1.08)" stroke="#8b2444" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8" y="8" width="8" height="8" rx="1"/><path d="M8 1v3m8-3v3M8 20v3m8-3v3M1 8h3m-3 8h3m16-8h3m-3 8h3"/></g>
  <text x="72" y="57" fill="#8b2444" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="19" font-weight="650" text-anchor="start">通用容器</text>
  <text x="39" y="98" fill="#25202a" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="26" font-weight="650" text-anchor="start">cpu</text>
  <text x="39" y="129" fill="#25202a" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="19" font-weight="450" text-anchor="start">默认使用 CPU</text>
  <rect x="330" y="22" width="288" height="124" rx="12" fill="#e9f5f3" stroke="#d9cfd5"/>
  <g transform="translate(343 36) scale(1.08)" stroke="#135f61" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h20v13H2V3m4 15v3h8v-3m2-9h4m-4 4h4"/><circle cx="9" cy="11.5" r="3.5"/></g>
  <text x="380" y="57" fill="#135f61" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="19" font-weight="650" text-anchor="start">Linux · NVIDIA</text>
  <text x="347" y="98" fill="#25202a" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="26" font-weight="650" text-anchor="start">nvidia</text>
  <text x="347" y="129" fill="#25202a" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="19" font-weight="450" text-anchor="start">驱动及容器 GPU 权限</text>
  <rect x="22" y="164" width="288" height="124" rx="12" fill="#e9f5f3" stroke="#d9cfd5"/>
  <g transform="translate(35 178) scale(1.08)" stroke="#135f61" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h20v13H2V3m4 15v3h8v-3m2-9h4m-4 4h4"/><circle cx="9" cy="11.5" r="3.5"/></g>
  <text x="72" y="199" fill="#135f61" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="19" font-weight="650" text-anchor="start">Linux · Intel / VAAPI</text>
  <text x="39" y="240" fill="#25202a" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="26" font-weight="650" text-anchor="start">qsv / vaapi</text>
  <text x="39" y="271" fill="#25202a" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="19" font-weight="450" text-anchor="start">映射 /dev/dri</text>
  <rect x="330" y="164" width="288" height="124" rx="12" fill="#f9edf1" stroke="#d9cfd5"/>
  <g transform="translate(343 178) scale(1.08)" stroke="#8b2444" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M12 17v4m-5 0h10"/></g>
  <text x="380" y="199" fill="#8b2444" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="19" font-weight="650" text-anchor="start">macOS 本机</text>
  <text x="347" y="240" fill="#25202a" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="26" font-weight="650" text-anchor="start">apple</text>
