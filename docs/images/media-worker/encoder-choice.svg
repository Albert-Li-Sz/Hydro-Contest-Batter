  <rect x="84" y="326" width="472" height="58" rx="12" fill="white" stroke="#d9cfd5"/>
  <g transform="translate(109 343) scale(1.05)" stroke="#135f61" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m10 8 6 4-6 4Z"/></g>
  <text x="151" y="363" fill="#25202a" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="650" text-anchor="start">应用配置 → 生成样片 → 核对回放</text>
