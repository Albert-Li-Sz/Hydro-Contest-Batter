services:
  reactions:
    image: ${HYDRO_MEDIA_IMAGE:-ghcr.io/albert-li-sz/reactions-generator-hydro:1.21.0}
    hostname: ${HYDRO_MEDIA_NODE:-reactions-01}
    restart: unless-stopped
    volumes:
      - ./out:/app/out
    command:
      - all
      - ${HYDRO_REACTIONS_API:?Set HYDRO_REACTIONS_API in the local .env file}
      - --hydro-upload
      - --total-workers
      - "${HYDRO_WORKER_TOTAL:-1}"
      - --worker-id
      - "${HYDRO_WORKER_ID:-0}"
      - --hardware
      - ${HYDRO_HARDWARE:-cpu}
