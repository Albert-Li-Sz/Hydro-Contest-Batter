services:
  reactions:
    image: ${HYDRO_MEDIA_IMAGE:-ghcr.io/albert-li-sz/reactions-generator-hydro:2.2.0}
    hostname: ${HYDRO_MEDIA_NODE:-reactions-01}
    restart: unless-stopped
    secrets:
      - hydro_media_env
    volumes:
      - ./out:/app/out
    command:
      - all
      - --hydro-upload
      - --total-workers
      - "${HYDRO_WORKER_TOTAL:-1}"
      - --worker-id
      - "${HYDRO_WORKER_ID:-0}"
      - --hardware
      - ${HYDRO_HARDWARE:-cpu}
secrets:
  hydro_media_env:
    file: ./.env
