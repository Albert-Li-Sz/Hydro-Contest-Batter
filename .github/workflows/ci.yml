name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: TypeScript, Build & Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  print-client:
    name: Print Client (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: print-client/go.mod
      - run: go test -v ./...
        working-directory: print-client

  media-worker:
    name: Media Worker (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 -m pip install requests Pillow
      - run: python3 -m py_compile media-worker/*.py
      - run: python3 -m unittest discover -v
        working-directory: media-worker
