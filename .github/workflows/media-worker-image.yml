name: Publish media worker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published stable release tag (for example v1.21.0)'
        required: true
        type: string

concurrency:
  group: publish-media-worker
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    # Plugin-only updates continue using the previously published worker image.
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && contains(join(github.event.release.assets.*.name, ','), 'reactions-generator-hydro-'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Check release and verify its source archive
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v([0-9]+\.){2}[0-9]+$ ]]
          version=${TAG#v}
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/reactions-generator-hydro"
          archive="reactions-generator-hydro-$version.tar.gz"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
            --jq '(.isDraft | not) and (.isPrerelease | not)' | grep -Fx true
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$archive" -p "$archive.sha256"
          digest=$(awk -v name="$archive" '$2 == name {print $1}' "$archive.sha256")
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --strict -
          mkdir source
          tar -xzf "$archive" --strip-components=1 -C source
          revision=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          printf 'IMAGE=%s\nVERSION=%s\nREVISION=%s\n' "$image" "$version" "$revision" >> "$GITHUB_ENV"

      - name: Build the native image and test the media worker
        run: |
          set -euo pipefail
          cd source
          # Keep the upstream license, adapter license and operator instructions in the image.
          printf '\nCOPY LICENSE LICENSE-Hydro-AGPL.txt HYDRO.md /usr/share/doc/reactions-generator-hydro/\n' >> Dockerfile
          docker build --pull \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.description=Hydro contest reaction video media worker" \
            --tag "$IMAGE:$VERSION-$ARCH" .
          test "$(docker image inspect "$IMAGE:$VERSION-$ARCH" --format '{{.Architecture}}')" = "$ARCH"
          docker run --rm -e NO_COLOR=1 "$IMAGE:$VERSION-$ARCH" all --help | grep -- '--hydro-upload'
          docker run --rm --entrypoint python -v "$PWD/tests:/app/tests:ro" "$IMAGE:$VERSION-$ARCH" -m unittest discover -s tests

      - name: Push the tested image
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION-$ARCH"

      - name: Attach the tested image for offline installation
        run: |
          set -euo pipefail
          archive="reactions-generator-hydro-$VERSION-linux-$ARCH.tar.gz"
          local_tag="reactions-generator-hydro:$VERSION-$ARCH"
          docker tag "$IMAGE:$VERSION-$ARCH" "$local_tag"
          docker save "$local_tag" | gzip -1 > "$archive"
          gh release upload "$TAG" "$archive" -R "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Publish the multi-platform manifest
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/reactions-generator-hydro"
          version=${TAG#v}
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tags=(--tag "$image:$version")
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG" ]]; then
            tags+=(--tag "$image:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$image:$version-amd64" "$image:$version-arm64"
          docker buildx imagetools inspect "$image:$version" --raw |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'

      - name: Attach offline image checksums
        run: |
          set -euo pipefail
          version=${TAG#v}
          sums="reactions-generator-hydro-$version-images.SHA256SUMS"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
          for arch in amd64 arm64; do
            file="reactions-generator-hydro-$version-linux-$arch.tar.gz"
            digest=$(jq -er --arg file "$file" '.assets[] | select(.name == $file) | .digest | sub("^sha256:";"")' release.json)
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            printf '%s  %s\n' "$digest" "$file" >> "$sums"
          done
          gh release upload "$TAG" "$sums" -R "$GITHUB_REPOSITORY" --clobber
