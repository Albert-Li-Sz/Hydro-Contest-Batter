{% set page_name = 'contest_xcpcio_monitor' %}
{% extends "layout/basic.html" %}
{% block content %}
<link rel="stylesheet" href="{{ codeBase }}/hydro-config.css">
<link rel="stylesheet" href="{{ codeBase }}/hydro-monitor.css">
<div class="row resolver-config" id="hydro-resolver-config"><div class="medium-12 columns" id="hydro-monitor">
  <section class="section visible">
    <div class="section__header resolver-heading"><div><h1 class="section__title">评测队列与监控</h1><p class="resolver-muted"><span id="contest-title"></span> · <span id="updated" role="status">加载中…</span></p></div><div class="xc-actions"><a class="button" href="control#work">比赛配置</a><a class="button" id="back-link">返回比赛</a></div></div>
    <div class="section__body">
      <ul class="monitor-alerts" id="alerts" aria-live="polite"></ul>
      <div class="monitor-cards" id="cards"></div>
    </div>
  </section>
  <section class="section visible">
    <div class="section__header"><h2 class="section__title">评测机</h2></div>
    <div class="section__body"><div class="monitor-machines" id="machines"></div></div>
  </section>
  <section class="section visible">
    <div class="section__header"><h2 class="section__title">正在评测</h2></div>
    <div class="section__body monitor-scroll"><table class="data-table"><thead><tr><th>评测机</th><th>提交</th><th>队伍</th><th>题目</th><th>语言</th><th>状态</th><th>测试点</th><th>已用时</th></tr></thead><tbody id="live"></tbody></table></div>
  </section>
  <section class="section visible">
    <div class="section__header"><h2 class="section__title">最近完成</h2></div>
    <div class="section__body monitor-scroll"><table class="data-table"><thead><tr><th>完成于</th><th>评测机</th><th>提交</th><th>队伍</th><th>题目</th><th>语言</th><th>结果</th><th>评测用时</th><th>运行时间</th><th>内存</th></tr></thead><tbody id="finished"></tbody></table></div>
  </section>
  <div class="row">
    <div class="medium-7 columns">
      <section class="section visible">
        <div class="section__header"><h2 class="section__title">本场待评测提交</h2></div>
        <div class="section__body monitor-scroll"><table class="data-table"><thead><tr><th>提交</th><th>队伍</th><th>题目</th><th>语言</th><th>状态</th><th>已等待</th></tr></thead><tbody id="pending"></tbody></table></div>
      </section>
    </div>
    <div class="medium-5 columns">
      <section class="section visible">
        <div class="section__header"><h2 class="section__title">本场系统错误</h2></div>
        <div class="section__body monitor-scroll"><table class="data-table"><thead><tr><th>提交</th><th>队伍</th><th>题目</th><th>语言</th></tr></thead><tbody id="system-errors"></tbody></table></div>
      </section>
    </div>
  </div>
</div></div>
<script type="application/json" id="monitor-runtime">{{ runtimeJson | safe }}</script>
<script type="module" src="{{ codeBase }}/js/hydro-monitor.js"></script>
{% endblock %}
