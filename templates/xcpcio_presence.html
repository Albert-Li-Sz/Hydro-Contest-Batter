{% set page_name = 'contest_xcpcio_presence' %}
{% extends "layout/basic.html" %}
{% block content %}
<link rel="stylesheet" href="{{ codeBase }}/hydro-config.css">
<link rel="stylesheet" href="{{ codeBase }}/hydro-presence.css">
<div class="row resolver-config" id="hydro-resolver-config"><div class="medium-12 columns" id="hydro-presence">
  <section class="section visible">
    <div class="section__header resolver-heading">
      <div><h1 class="section__title">机位签到与监控</h1><p class="resolver-muted"><span id="contest-title"></span> · <span id="updated" role="status">加载中…</span></p></div>
      <div class="presence-actions"><button class="button" type="button" id="sound" aria-pressed="false">声音</button><div class="xc-actions"><a class="button" href="control#work">比赛配置</a><a class="button" id="back-link">返回比赛</a></div></div>
    </div>
    <div class="section__body">
      <div class="presence-counts" id="counts"></div>
      <div class="presence-layout">
        <div class="presence-map" id="map"></div>
        <aside class="presence-alerts" aria-label="告警"><ul id="alerts" aria-live="polite"></ul></aside>
      </div>
    </div>
  </section>
</div></div>
<script type="application/json" id="presence-runtime">{{ runtimeJson | safe }}</script>
<script type="module" src="{{ codeBase }}/js/hydro-presence.js"></script>
{% endblock %}
