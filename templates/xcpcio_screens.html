{% set page_name = 'contest_xcpcio_screens' %}
{% extends "layout/basic.html" %}
{% block content %}
<link rel="stylesheet" href="{{ codeBase }}/hydro-config.css">
<link rel="stylesheet" href="{{ codeBase }}/hydro-screens.css">
<div class="row resolver-config" id="hydro-resolver-config"><div id="hydro-screens">
  <div class="medium-9 columns">
    <section class="section visible">
      <div class="section__header resolver-heading"><div><h1 class="section__title">大屏画面与链接</h1><p class="resolver-muted" id="contest-title"></p></div><div class="xc-actions"><a class="button" href="control#media">比赛配置</a><a class="button" id="back-link">返回比赛</a></div></div>
      <div class="section__body">
        <p id="message" class="resolver-error" role="alert" hidden></p>
        <div class="resolver-fields resolver-two">
          <label>画面语言<select class="select" id="locale"><option value="zh-CN">中文</option><option value="en">English</option></select></label>
        </div>
      </div>
    </section>
    <div id="screen-panel"></div>
    <section class="section visible">
      <div class="section__body">
        <div class="resolver-actions" style="margin-top:0"><span class="resolver-muted" id="save-status" role="status"></span><span class="screens-spacer"></span><button type="button" class="button" id="reset-token">作废并重新生成全部链接</button></div>
      </div>
    </section>
    <p class="resolver-muted">ICPC Tools 画面组件经 Resolver-Web v1.4.0 移植 · <a href="/hydro-resolver/licenses/ICPC-Software-License.txt">ICPC Software License</a> · <a href="/hydro-resolver/licenses/Resolver-Web-Apache-2.0.txt">Apache-2.0</a></p>
  </div>
  <div class="medium-3 columns screens-side-column"><div class="screens-side">
    <section class="section side visible">
      <div class="section__header"><h2 class="section__title">画面</h2></div>
      <ul class="menu" id="screen-menu" aria-label="大屏画面"></ul>
    </section>
  </div></div>
  <dialog id="screen-preview" aria-labelledby="preview-title"><form method="dialog" class="screen-preview-header"><h2 id="preview-title"></h2><button class="button">关闭</button></form><iframe id="screen-preview-frame" title="大屏预览" allowfullscreen></iframe></dialog>
  <dialog id="reset-confirm" aria-labelledby="reset-title"><form method="dialog"><h2 id="reset-title">作废全部大屏链接</h2><p>所有已打开的大屏会立即失效，需要在每台大屏电脑上打开新链接。确定继续？</p><div class="resolver-actions"><button class="button" value="cancel">取消</button><button class="button primary" value="confirm">作废并重新生成</button></div></form></dialog>
</div></div>
<script type="application/json" id="screens-runtime">{{ runtimeJson | safe }}</script>
<script type="module" src="{{ codeBase }}/js/hydro-screens.js"></script>
{% endblock %}
